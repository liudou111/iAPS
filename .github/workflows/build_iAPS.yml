name: 4. Build iAPS (Unsigned)
run-name: Build iAPS unsigned (${{ github.ref_name }})
on:
  workflow_dispatch:

  push:

env:
  UPSTREAM_REPO: Artificial-Pancreas/iAPS
  UPSTREAM_BRANCH: ${{ github.ref_name }}
  TARGET_BRANCH: ${{ github.ref_name }}
  ALIVE_BRANCH: alive

jobs:
  auto_build_check:
    name: Check Auto Build Status
    runs-on: ubuntu-latest
    outputs:
      AUTO_BUILD_ENABLED: ${{ steps.auto-build-enabled.outputs.auto_build }}

    steps:
      - name: Is Auto Build Branch
        id: auto-build-enabled
        run: |
          echo "auto_build=false" >> $GITHUB_OUTPUT
          if [ ! -z "${{ vars.AUTO_BUILD_BRANCHES }}" ]; then
            if echo ",${{ vars.AUTO_BUILD_BRANCHES }}," | grep -q ",${{ github.ref_name }},"; then
              echo "auto_build=true" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Show Auto Build Status
        run: |
          echo "Auto Build Status: ${{ steps.auto-build-enabled.outputs.auto_build }}"

  # (Removed) check_certs job is no longer needed for an unsigned build.

  check_latest_from_upstream:
    needs: [auto_build_check]
    if: needs.auto_build_check.outputs.AUTO_BUILD_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: Check upstream
    outputs:
      NEW_COMMITS: ${{ steps.sync.outputs.has_new_commits }}

    steps:
      - name: Checkout target repo
        if: vars.SCHEDULED_SYNC == 'true'
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_PAT }}
          ref: alive

      - name: Sync upstream changes
        if: |
          vars.SCHEDULED_SYNC == 'true' && github.repository_owner != 'Artificial-Pancreas'
        id: sync
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4
        with:
          target_sync_branch: ${{ env.TARGET_BRANCH }}
          shallow_since: 6 months ago
          target_repo_token: ${{ secrets.GH_PAT }}
          upstream_sync_branch: ${{ env.UPSTREAM_BRANCH }}
          upstream_sync_repo: ${{ env.UPSTREAM_REPO }}

      - name: New commits found
        if: |
          vars.SCHEDULED_SYNC == 'true' && steps.sync.outputs.has_new_commits == 'true'
        run: echo "New commits were found to sync."

      - name: No new commits
        if: |
          vars.SCHEDULED_SYNC == 'true' && steps.sync.outputs.has_new_commits == 'false'
        run: echo "There were no new commits."

      - name: Show value of 'has_new_commits'
        if: |
          vars.SCHEDULED_SYNC == 'true'
        run: |
          echo ${{ steps.sync.outputs.has_new_commits }}
          echo "NEW_COMMITS=${{ steps.sync.outputs.has_new_commits }}" >> $GITHUB_OUTPUT

  # Builds iAPS UNSIGNED (no certificates, no provisioning, no TestFlight)
  build:
    name: Build (Unsigned)
    needs: [auto_build_check, check_latest_from_upstream]
    if: needs.auto_build_check.outputs.AUTO_BUILD_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Set special variables
        env:
          APP_IDENTIFIER_SECRET: ${{ secrets.APP_IDENTIFIER }}
          APP_IDENTIFIER_VAR: ${{ vars.APP_IDENTIFIER }}
          BUILD_GROUP_VAR: ${{ vars.BUILD_GROUP }}
        run: |
          APP_ID="${APP_IDENTIFIER_SECRET:-$APP_IDENTIFIER_VAR}"
          if [ -n "$APP_ID" ]; then
            echo "APP_IDENTIFIER=$APP_ID" >> "$GITHUB_ENV"
          fi
          if [ -n "$BUILD_GROUP_VAR" ]; then
            echo "BUILD_GROUP=$BUILD_GROUP_VAR" >> "$GITHUB_ENV"
          fi

      - name: Select Xcode version
        run: |
          echo "Available Xcode versions:"
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "::error::Xcode 26.x NOT found on this runner"
            exit 1
          fi
          echo "Selecting $XCODE"
          sudo xcode-select --switch "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Checkout Repo for syncing
        if: vars.SCHEDULED_SYNC == 'true'
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_PAT }}
          ref: ${{ env.TARGET_BRANCH }}

      - name: Sync upstream changes
        if: |
          vars.SCHEDULED_SYNC == 'true' && github.repository_owner != 'Artificial-Pancreas'
        id: sync
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4
        with:
          target_sync_branch: ${{ env.TARGET_BRANCH }}
          shallow_since: 6 months ago
          target_repo_token: ${{ secrets.GH_PAT }}
          upstream_sync_branch: ${{ env.UPSTREAM_BRANCH }}
          upstream_sync_repo: ${{ env.UPSTREAM_REPO }}

      - name: New commits found
        if: |
          vars.SCHEDULED_SYNC == 'true' && steps.sync.outputs.has_new_commits == 'true'
        run: echo "New commits were found to sync."

      - name: No new commits
        if: |
          vars.SCHEDULED_SYNC == 'true' && steps.sync.outputs.has_new_commits == 'false'
        run: echo "There were no new commits."

      - name: Checkout Repo for building
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_PAT }}
          submodules: recursive
          ref: ${{ env.TARGET_BRANCH }}

      # Build iAPS UNSIGNED: archive with code signing disabled, then package the
      # resulting .app into an IPA manually. No certificates / provisioning / fastlane.
      - name: Build unsigned IPA
        run: |
          set -euo pipefail

          xcodebuild archive \
            -workspace FreeAPS.xcworkspace \
            -scheme FreeAPSWorkspace \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/FreeAPS.xcarchive \
            -resultBundlePath buildlog \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE=""

          APP_PATH=$(find build/FreeAPS.xcarchive/Products/Applications -maxdepth 1 -name '*.app' -type d | head -n1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::No .app found inside the xcarchive"
            exit 1
          fi
          echo "Found app: $APP_PATH"

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r iAPS-unsigned.ipa Payload
          rm -rf Payload
          echo "Built IPA: $(du -h iAPS-unsigned.ipa | cut -f1)"

      # Upload the unsigned IPA and the build log as artifacts (no TestFlight upload)
      - name: Upload unsigned IPA and build log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: iAPS-unsigned-ipa
          path: |
            iAPS-unsigned.ipa
            buildlog
